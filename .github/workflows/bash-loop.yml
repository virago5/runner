name: Run Bash Loop

# Parked while the waiting-delivery repro is being measured: it would take a
# machine from the same pool on every push and muddy the observation. Restore
# the push trigger below when the measurement is done.
#
# on:
#   push:
#     branches:
#       - main

on:
  workflow_dispatch:

jobs:
  run-loop:
    runs-on:
      - image:linux-docker-bitvirt
      - machine_type:g2.linux.amd-zen4.8c-32g
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run bash loop script 🚀
        run: |
          echo "Starting loop"
          for i in {1..60}
          do
            echo "Loop iteration $i"
            sleep 1
          done
          echo "Loop finished"

# Reproduces the twin-job assignment race: two identical jobs enqueue in the
# same second against a scale-to-zero pool capped at 1 ephemeral runner. When
# the first VM registers, GitHub races both jobs onto the same runner — the
# loser is expected to wedge (stays queued forever, log shows "Job is about
# to start running on the runner: X" then "Waiting for a runner...").
#
# Install as .github/workflows/twin-race.yml in the virago5 test repo.
# Replace POOL_LABEL below with the staging pool's bitrise_pool_name label.
name: twin-race
on:
  workflow_dispatch:
jobs:
  twin:
    strategy:
      fail-fast: false
      matrix:
        idx: [1, 2, 3]
    runs-on:
      - "image:linux-docker-bitvirt"
      - "machine_type:g2.linux.amd-zen4.8c-32g"
    timeout-minutes: 5
    steps:
      - name: work
        run: |
          echo "twin ${{ matrix.idx }} on $RUNNER_NAME"
          sleep 30
